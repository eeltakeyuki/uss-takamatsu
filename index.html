        }
        .video-item img:hover,

        /**
         * セクション名に応じたアイコン絵文字を返す関数
         * @param {string} tabTitle - セクションのタイトル
         * @returns {string} - 対応する絵文字
         */
        function getIconForTab(tabTitle) {
            if (tabTitle.includes('年')) {
                return '📅';
            }
            switch (tabTitle) {
                case 'おすすめ再生リスト':
                    return '⭐';
                // ★ 「エンタメ動画」のケースを追加
                case 'エンタメ動画':
                    return '▶️';
                case 'その他':
                    return '➕';
                default:
                    return '';
            }
        }

        /**
         * ページ全体のレイアウトを生成する関数
         */
        function buildLayout() {
            data.forEach(sectionData => {
                const section = document.createElement('div');
                section.className = 'section';
                
                const iconEmoji = getIconForTab(sectionData.tab);
                const iconSpan = iconEmoji ? `<span class="icon">${iconEmoji}</span>` : '';
                section.innerHTML = `<h2>${iconSpan}${sectionData.tab}</h2>`;

                const horizontalList = document.createElement('div');
                horizontalList.className = 'horizontal-video-list';

                sectionData.lists.forEach(list => {
                    // 「おすすめ動画」のセクションだけ大きいサムネイルを適用
                    const itemClassName = (sectionData.tab === 'おすすめ再生リスト') 
                        ? 'featured-scroll-item' 
                        : 'video-item';

                    const thumbnailPath = `thumbnail/${list.id}.jpg`;
                    const videoItem = document.createElement('div');
                    videoItem.className = itemClassName;
                    videoItem.innerHTML = `
                        <a href="https://www.youtube.com/playlist?list=${list.id}" target="_blank">
                            <img src="${thumbnailPath}" alt="${list.title}" onerror="this.src='thumbnail/default.jpg';">
                        </a>
                        <p class="video-title">
                            <a href="https://www.youtube.com/playlist?list=${list.id}" target="_blank">${list.title}</a>
                        </p>
                    `;
                    horizontalList.appendChild(videoItem);
                });

                section.appendChild(horizontalList);
                contentContainer.appendChild(section);
            });
        }

        document.addEventListener("DOMContentLoaded", buildLayout);

        // --- ★ PWA自動更新検知 & リロード処理の追加 ---
        if ('serviceWorker' in navigator) {
            let refreshing = false;

            // 新しいService Workerが有効化（即時適用）された時に一度だけページを自動リロード
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    // ページアクセス時にサーバーへsw.jsの更新確認を行う
                    registration.update();
                });
            });
        }
